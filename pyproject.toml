[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "follicle-ml"
version = "0.1.0"
description = "Research/education pipeline for classifying ovarian ultrasound images (Normal, Dominant Follicle, PCO). Not a diagnostic tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pillow>=10.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "imagehash>=4.3",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
secondary = ["datasets>=2.16"]
dev = ["pytest>=7.4"]

[project.scripts]
follicle-ml = "follicle_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
