# Default experiment config. Override any key on the command line with
#   follicle-ml -s train.epochs=20 -s model.name=efficientnet_b0 train-cnn
seed: 42
data_dir: data
output_dir: outputs

data:
  # Crop to the ultrasound fan and drop on-screen text/calipers outside it.
  crop_to_fan: true
  image_size: 224
  # Perceptual-hash Hamming distance at or below which two images count as duplicates.
  # 0-2 were visually confirmed duplicates in the main dataset; 6+ were distinct scans.
  dup_threshold: 4
  # all | standard_export. Most Normal images come from a different source than the
  # other classes (see context/data_audit.md); standard_export is the sensitivity analysis.
  subset: all

cv:
  n_splits: 5
  # Fraction of each training fold held out for early stopping (never the test fold).
  inner_val_fraction: 0.15

model:
  name: resnet18          # resnet18 | efficientnet_b0
  pretrained: true

train:
  epochs: 25
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  patience: 6
  class_weights: true
  num_workers: 2

augment:
  hflip: true
  vflip: false
  rotation_deg: 10
  brightness: 0.2
  contrast: 0.2
  speckle_std: 0.1

knn:
  k_values: [1, 3, 5, 7, 9, 15]
  raw_pixel_size: 64
